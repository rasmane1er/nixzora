version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
