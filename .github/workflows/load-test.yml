name: Load test

# Run by hand from the Actions tab. Never scheduled: a load test is traffic we chose to send.
# How to read the results and what to change before a full run: docs/performance/load-testing.md
on:
  workflow_dispatch:
    inputs:
      profile:
        description: smoke (a few requests), load (expected peak), stress (up to 10x), spike (8x burst)
        type: choice
        options: [smoke, load, stress, spike]
        default: smoke
      environment:
        description: Where to send the traffic (production is not offered on purpose)
        type: choice
        options: [staging]
        default: staging
      duration:
        description: Steady-state length for the load profile
        type: string
        default: 5m
      scale:
        description: Multiplies every journey's rate (0.5 = half; staging is small, see the guide)
        type: string
        default: '1'
      checkout:
        description: Also place guest orders (only where PAYMENTS_PROVIDER=fake)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: load-test-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  k6:
    name: ${{ inputs.profile }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    env:
      PROFILE: ${{ inputs.profile }}
      DURATION: ${{ inputs.duration }}
      SCALE: ${{ inputs.scale }}
      CHECKOUT: ${{ inputs.checkout && '1' || '' }}
      WEB_URL: ${{ vars.STOREFRONT_URL }}
      API_URL: ${{ vars.API_URL }}
      K6_NO_USAGE_REPORT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'

      - name: Check the target is up
        run: curl -fsS "$API_URL/api/v1/health" > /dev/null

      - name: Run k6
        # Thresholds failing (an SLO missed) fails the job, after the report is written.
        run: k6 run --quiet tests/load/shop.js

      - name: Summary
        if: always()
        run: cat tests/load/results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-${{ inputs.profile }}-${{ github.run_id }}
          path: tests/load/results/*-*.*
          if-no-files-found: ignore
          retention-days: 30
