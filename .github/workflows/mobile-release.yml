name: Mobile release

# Builds the app in Expo's cloud (EAS Build) and sends it to TestFlight and Google Play internal
# testing. Run it by hand from the Actions tab. Needs the EXPO_TOKEN secret in the "mobile"
# environment and the store credentials stored in EAS (see docs/runbooks/mobile-release.md).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build and submit (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the app before spending build minutes
        run: pnpm turbo run lint typecheck test --filter=@nixzora/mobile...
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build in EAS and submit to the stores' test tracks
        working-directory: apps/mobile
        run: >-
          eas build
          --profile ${{ inputs.profile }}
          --platform ${{ inputs.platform }}
          --non-interactive
          --no-wait
          --auto-submit
