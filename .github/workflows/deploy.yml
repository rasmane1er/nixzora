name: Deploy

# Every push to main deploys to staging. Production deploys the same images after a
# manual approval on the "production" GitHub environment (Settings → Environments).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS role; no stored AWS keys

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
  TAG: ${{ github.sha }}

jobs:
  images:
    name: Build and push images
    if: vars.ECR_REGISTRY != ''
    # Native arm64 runner (free for public repositories): emulating arm64 with QEMU made the
    # large migrate image build stall for over 20 minutes.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - { app: api, target: runtime, suffix: '' }
          - { app: api, target: migrate, suffix: '-migrate' }
          - { app: storefront, target: runtime, suffix: '' }
          - { app: admin, target: runtime, suffix: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push nixzora/${{ matrix.app }}:${{ env.TAG }}${{ matrix.suffix }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64 # Fargate Graviton: cheaper per vCPU
          push: true
          provenance: false
          build-args: APP_VERSION=${{ env.TAG }}
          tags: ${{ env.ECR_REGISTRY }}/nixzora/${{ matrix.app }}:${{ env.TAG }}${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.target }}

  staging:
    name: Deploy to staging
    needs: images
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      tag: ${{ github.sha }}
    secrets: inherit

  production:
    name: Deploy to production
    needs: [images, staging]
    # Off until the production environment exists: set the repository variable PRODUCTION_ENABLED=true.
    if: always() && vars.PRODUCTION_ENABLED == 'true' && needs.images.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') && (github.event_name == 'push' || github.event.inputs.environment == 'production')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      tag: ${{ github.sha }}
    secrets: inherit
