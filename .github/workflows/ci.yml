name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16 # PostgreSQL 16 + pgvector (ADR-0009)
        env:
          POSTGRES_USER: nixzora
          POSTGRES_PASSWORD: nixzora_ci_password
          POSTGRES_DB: nixzora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nixzora -d nixzora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Single-node Kafka (KRaft) for the event-streaming test (ADR-0020); listens on localhost:9092.
      kafka:
        image: apache/kafka-native:3.9.1
        ports: ['9092:9092']

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nixzora:nixzora_ci_password@localhost:5432/nixzora?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Shell scripts (deploy, disaster recovery)
        run: shellcheck --severity=warning scripts/*.sh scripts/*/*.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter @nixzora/api prisma:deploy

      - name: Check schema.prisma matches the migrations
        run: pnpm --filter @nixzora/api prisma:drift

      - name: End-to-end tests (API + PostgreSQL + Redis + Kafka)
        run: pnpm test:e2e
        env:
          KAFKA_TEST_BROKERS: localhost:9092

      - name: Build
        run: pnpm build

      - name: Seed the demo catalog
        run: pnpm --filter @nixzora/api db:seed

      - name: Assistant evaluation set (local AI drivers, 90% bar, zero ungrounded picks)
        run: pnpm --filter @nixzora/api eval:assistant

      - name: Install Chromium for browser tests
        run: pnpm --filter @nixzora/storefront exec playwright install --with-deps chromium

      - name: Browser test (a guest buys a product)
        run: pnpm --filter @nixzora/storefront test:browser

      - name: Keep the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 7

  mobile:
    name: Mobile app bundles (iOS and Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@nixzora/mobile^...
      - name: Resolve the app config for every variant (config plugins must load)
        working-directory: apps/mobile
        run: |
          for variant in development preview production; do
            APP_VARIANT=$variant APP_LINK_DOMAIN=nixzora.example pnpm exec expo config --type introspect > /dev/null
          done
      - name: Bundle JavaScript for iOS and Android (Metro + Hermes bytecode)
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/bundles"

  infrastructure:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.x
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        run: |
          for dir in bootstrap environments/staging environments/production; do
            echo "::group::$dir"
            terraform -chdir=infra/terraform/$dir init -backend=false -input=false
            terraform -chdir=infra/terraform/$dir validate
            echo "::endgroup::"
          done
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Helm chart lint and Kubernetes schema check (ADR-0021)
        run: |
          helm lint infra/helm/nixzora -f infra/helm/nixzora/values-staging.yaml --strict
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in values.yaml values-staging.yaml; do
            helm template nixzora infra/helm/nixzora -n nixzora --kube-version 1.31.0 -f "infra/helm/nixzora/$values" \
              | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas
          done
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas infra/helm/cluster
      - name: Prometheus rules, Prometheus config and Alertmanager config (ADR-0023)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check rules /etc/prometheus/rules/slo.yml /etc/prometheus/rules/operations.yml
          docker run --rm --entrypoint amtool -v "$PWD/infra/observability/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          for f in infra/observability/grafana/dashboards/*.json; do jq -e '.uid and (.panels | length > 0)' "$f" > /dev/null; done
      - name: Plan both environments against mocked AWS (terraform test)
        run: |
          terraform -chdir=infra/terraform/modules/platform init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/platform test

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        app: [api, storefront, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level=high
