packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - '@parcel/watcher'

# Security overrides for transitive dependencies flagged by pnpm audit.
overrides:
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1

# Reviewed advisories that do not affect what we ship. Re-check when upgrading Expo.
auditConfig:
  ignoreGhsas:
    # node-forge (no fixed version yet), pulled in only by the Expo CLI for local dev-server
    # certificates. It is never bundled into the app or used by the API or web servers.
    - GHSA-86w9-cpqp-85rv
    # braces (no fixed version yet), reached only through the Expo CLI's file watcher
    # (@expo/metro-file-map > micromatch) at build time; it never parses untrusted input.
    - GHSA-vfj7-8cjw-p6xm
