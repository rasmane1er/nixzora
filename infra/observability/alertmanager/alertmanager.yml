# Local Alertmanager: alerts show in its UI (http://localhost:9093). In AWS, alerts from Amazon
# Managed Prometheus go to the same SNS topic as the CloudWatch alarms (ADR-0023).
route:
  receiver: ui-only
  group_by: [alertname, slo, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: ui-only
      repeat_interval: 1h
receivers:
  - name: ui-only
inhibit_rules:
  # A fast burn already paging hides the slow-burn ticket for the same SLO.
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]
