# External Secrets Operator → AWS Secrets Manager. The operator's service account
# (external-secrets/external-secrets) gets read access to NIXZORA's secrets through the Pod
# Identity association in infra/terraform/modules/platform/eks.tf.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
  conditions:
    - namespaces: [nixzora]
