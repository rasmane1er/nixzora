# Staging on EKS (ADR-0021). Fill in the account-specific values from the Terraform outputs
# (`tofu output -json platform` in infra/terraform/environments/staging).
image:
  registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  tag: replace-with-a-pushed-git-sha

aws:
  databaseHost: nixzora-staging.replace-me.us-east-1.rds.amazonaws.com
  redisHost: master.nixzora-staging.replace-me.use1.cache.amazonaws.com
  mediaBucket: nixzora-staging-media-replace-me

apiEnv:
  PAYMENTS_PROVIDER: fake
  ALLOW_TEST_PAYMENTS: 'true'
  SHIPPING_PROVIDER: none

externalSecrets:
  remote:
    database: rds!db-replace-with-the-managed-secret-name

ingress:
  certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/replace-me

services:
  storefront:
    replicas: 1
    autoscaling: { min: 1, max: 3, cpu: 60 }
    # Universal links / App Links (same as the ECS storefront).
    env:
      IOS_APP_IDS: 7HD2Z858BV.com.nixzora.shop.preview
      ANDROID_PACKAGE: com.nixzora.shop.preview
  api:
    replicas: 1
    autoscaling: { min: 1, max: 3, cpu: 60 }
