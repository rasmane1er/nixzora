{{- if .Values.networkPolicies.enabled }}
# Nothing reaches a pod unless a rule below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nixzora.name" (dict "root" . "component" "default-deny") }}
  labels:
    {{- include "nixzora.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
{{- range $component, $svc := .Values.services }}
{{- if and $svc.enabled (ne $component "worker") }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nixzora.name" $ctx }}
  labels:
    {{- include "nixzora.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nixzora.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: {{ $svc.port }}, protocol: TCP }
      from:
        {{- if $svc.public }}
        # The ALB (in the VPC) and the kubelet's health checks.
        - ipBlock: { cidr: {{ $.Values.networkPolicies.vpcCidr }} }
        {{- end }}
        {{- if eq $component "api" }}
        # The storefront and Ops Center call the API inside the cluster.
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [storefront, admin] }
        {{- end }}
        {{- range $caller := $svc.internalOnlyFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $caller }}
        {{- end }}
---
{{- end }}
{{- end }}
---
# Prometheus (in its own namespace) may scrape the metrics port of the API-image pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nixzora.name" (dict "root" . "component" "metrics") }}
  labels:
    {{- include "nixzora.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [api, worker, search, ai] }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 9464, protocol: TCP }
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.metricsNamespace }}
{{- end }}
