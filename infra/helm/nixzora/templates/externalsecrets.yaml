{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $store := dict "kind" $es.storeKind "name" $es.storeName }}
# App secrets for the API image's processes: the JSON app secret plus the database, Redis and
# internal-API passwords, all from AWS Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nixzora.name" (dict "root" . "component" "app") }}
  labels:
    {{- include "nixzora.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: {{ include "nixzora.name" (dict "root" . "component" "app") }}
  dataFrom:
    - extract:
        key: {{ $es.remote.app | quote }}
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: {{ $es.remote.redis | quote }} }
    - secretKey: INTERNAL_API_KEY
      remoteRef: { key: {{ $es.remote.internal | quote }} }
    {{- if $es.remote.database }}
    - secretKey: DATABASE_PASSWORD
      remoteRef: { key: {{ $es.remote.database | quote }}, property: password }
    {{- end }}
---
# Model provider keys: only the AI service mounts this one (ADR-0016).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nixzora.name" (dict "root" . "component" "ai") }}-keys
  labels:
    {{- include "nixzora.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: {{ include "nixzora.name" (dict "root" . "component" "ai") }}-keys
  dataFrom:
    - extract:
        key: {{ $es.remote.ai | quote }}
---
# The storefront and Ops Center only need the internal API key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nixzora.name" (dict "root" . "component" "internal") }}
  labels:
    {{- include "nixzora.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $store | nindent 4 }}
  target:
    name: {{ include "nixzora.name" (dict "root" . "component" "internal") }}
  data:
    - secretKey: INTERNAL_API_KEY
      remoteRef: { key: {{ $es.remote.internal | quote }} }
{{- end }}
